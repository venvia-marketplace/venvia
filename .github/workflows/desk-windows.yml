name: VenVia Desk Windows preview
on:
  push:
    branches: ['desk/0.4']
    paths:
      - 'desk/installer/**'
      - '.github/workflows/desk-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile preview
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc desk/installer/VenViaDesk.iss
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          $exe = Get-ChildItem desk/installer/output/*.exe
          if (!$exe) { throw 'Missing EXE' }
          Get-FileHash $exe.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content desk/installer/output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VenVia-Desk-Windows-preview
          path: desk/installer/output/
          if-no-files-found: error
